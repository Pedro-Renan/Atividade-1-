services:
  app:
    build: .
    container_name: atividade01-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=atividade01
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: atividade01-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: